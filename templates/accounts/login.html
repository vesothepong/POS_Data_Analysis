{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Sign in · Smart Inventory Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,300;1,400;1,500;1,700;1,900&family=Kantumruy+Pro:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v=20261004_06">
  <script>document.documentElement.dataset.theme=localStorage.getItem('cadence-theme')||((window.matchMedia&&window.matchMedia('(prefers-color-scheme:light)').matches)?'light':'dark');const savedLang=localStorage.getItem('cadence-lang')||'en';document.documentElement.lang=savedLang;document.documentElement.dataset.lang=savedLang;</script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-top-controls">
      <div class="lang-switch-group" role="group" aria-label="Language">
        <button type="button" class="lang-btn active" data-lang="en" title="English" onclick="setLang('en')">EN</button>
        <button type="button" class="lang-btn" data-lang="km" title="ភាសាខ្មែរ" onclick="setLang('km')">ខ្មែរ</button>
      </div>
      <button class="icon-button theme-toggle auth-theme" id="themeToggle" type="button" title="Switch color theme" aria-label="Switch color theme">
        <i class="bi bi-sun-fill theme-sun"></i>
        <i class="bi bi-moon-stars-fill theme-moon"></i>
      </button>
    </div>
    <section class="auth-card">
      <div class="auth-brand">
        <svg class="stocksight-icon" width="30" height="30" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:30px;height:30px;max-width:30px;flex-shrink:0;">
          <!-- Clipboard Shadow -->
          <rect x="11" y="9" width="42" height="51" rx="6" fill="#000000" fill-opacity="0.12" />
          <!-- Clipboard Backboard -->
          <rect x="11" y="8" width="42" height="50" rx="6" fill="#1e3d68" />
          <!-- Clamp Ring / Tab -->
          <path d="M27 8.5C27 5.5 29.2 3 32 3C34.8 3 37 5.5 37 8.5" stroke="#1e3d68" stroke-width="3.5" stroke-linecap="round" fill="none" />
          <circle cx="32" cy="6.5" r="1.8" fill="#ffffff" />
          <!-- Clamp Metal Bar -->
          <rect x="21" y="6" width="22" height="7" rx="2.5" fill="#162e50" />
          <circle cx="32" cy="9.5" r="1.8" fill="#ffffff" />
          <!-- Clipboard Paper Sheet -->
          <rect x="15" y="14" width="34" height="41" rx="3.5" fill="#ffffff" />
          <!-- Checkmark Row 1 -->
          <circle cx="21.5" cy="22" r="3.4" fill="#22c55e" />
          <path d="M19.8 22.1L21 23.3L23.4 20.8" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="27.5" y1="21" x2="44.5" y2="21" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
          <line x1="27.5" y1="24.5" x2="39.5" y2="24.5" stroke="#bfdbfe" stroke-width="1.6" stroke-linecap="round" />
          <!-- Checkmark Row 2 -->
          <circle cx="21.5" cy="30.5" r="3.4" fill="#22c55e" />
          <path d="M19.8 30.6L21 31.8L23.4 29.3" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="27.5" y1="29.5" x2="44.5" y2="29.5" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
          <line x1="27.5" y1="33" x2="38" y2="33" stroke="#bfdbfe" stroke-width="1.6" stroke-linecap="round" />
          <!-- Checkmark Row 3 -->
          <circle cx="21.5" cy="39" r="3.4" fill="#22c55e" />
          <path d="M19.8 39.1L21 40.3L23.4 37.8" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round" />
          <line x1="27.5" y1="38" x2="37" y2="38" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
          <line x1="27.5" y1="41.5" x2="33" y2="41.5" stroke="#bfdbfe" stroke-width="1.6" stroke-linecap="round" />
          <!-- Ground Shadow -->
          <ellipse cx="21" cy="59" rx="16" ry="3" fill="#0f1f35" fill-opacity="0.2" />
          <!-- Box 1 (Top Box) -->
          <g>
            <path d="M15 32L22 28.5L29 32L22 35.5L15 32Z" fill="#f5b86e" stroke="#ffffff" stroke-width="0.6" />
            <path d="M18.5 30.2L22 28.5L25.5 30.2L22 32L18.5 30.2Z" fill="#8a4914" fill-opacity="0.75" />
            <path d="M15 32L22 35.5V44L15 40.5V32Z" fill="#e0913e" />
            <path d="M20.2 34.6L22 35.5V44H20.2V34.6Z" fill="#8a4914" fill-opacity="0.75" />
            <path d="M22 35.5L29 32V40.5L22 44V35.5Z" fill="#c57628" />
            <path d="M17 38.5V37M17 37L16.2 37.7M17 37L17.8 37.7M19 38.5V37M19 37L18.2 37.7M19 37L19.8 37.7" stroke="#613009" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
          </g>
          <!-- Box 2 (Bottom-Left Box) -->
          <g>
            <path d="M6 44.5L14 40.5L22 44.5L14 48.5L6 44.5Z" fill="#f5b86e" stroke="#ffffff" stroke-width="0.6" />
            <path d="M10 42.5L14 40.5L18 42.5L14 44.5L10 42.5Z" fill="#8a4914" fill-opacity="0.75" />
            <path d="M6 44.5L14 48.5V58L6 54V44.5Z" fill="#e0913e" />
            <path d="M12 47.5L14 48.5V58H12V47.5Z" fill="#8a4914" fill-opacity="0.75" />
            <path d="M14 48.5L22 44.5V54L14 58V48.5Z" fill="#c57628" />
            <path d="M8.5 51.5V49.8M8.5 49.8L7.6 50.6M8.5 49.8L9.4 50.6M10.8 51.5V49.8M10.8 49.8L9.9 50.6M10.8 49.8L11.7 50.6" stroke="#613009" stroke-width="0.85" stroke-linecap="round" stroke-linejoin="round" />
          </g>
          <!-- Box 3 (Bottom-Right Box) -->
          <g>
            <path d="M18 43.5L25 39.8L32 43.5L25 47.2L18 43.5Z" fill="#f5b86e" stroke="#ffffff" stroke-width="0.6" />
            <path d="M18 43.5L25 47.2V57L18 53.3V43.5Z" fill="#e0913e" />
            <path d="M25 47.2L32 43.5V53.3L25 57V47.2Z" fill="#c57628" />
            <path d="M23.5 46.4L25 47.2V57H23.5V46.4Z" fill="#8a4914" fill-opacity="0.75" />
            <path d="M20.2 50.8V49.2M20.2 49.2L19.4 49.9M20.2 49.2L21 49.9M22.2 50.8V49.2M22.2 49.2L21.4 49.9M22.2 49.2L23 49.9" stroke="#613009" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" />
          </g>
          <!-- Gear & Bar Chart Group -->
          <g transform="translate(46, 46)">
            <circle r="15.5" fill="#ffffff" />
            <rect x="-3.5" y="-14" width="7" height="28" rx="2" fill="#1e3d68" />
            <rect x="-3.5" y="-14" width="7" height="28" rx="2" fill="#1e3d68" transform="rotate(45)" />
            <rect x="-3.5" y="-14" width="7" height="28" rx="2" fill="#1e3d68" transform="rotate(90)" />
            <rect x="-3.5" y="-14" width="7" height="28" rx="2" fill="#1e3d68" transform="rotate(135)" />
            <circle r="12" fill="#1e3d68" />
            <circle r="8" fill="#ffffff" />
            <rect x="-5" y="-1" width="2.5" height="6" rx="0.7" fill="#1e3d68" />
            <rect x="-1.25" y="-4" width="2.5" height="9" rx="0.7" fill="#1e3d68" />
            <rect x="2.5" y="-7.5" width="2.5" height="12.5" rx="0.7" fill="#1e3d68" />
          </g>
        </svg>
        <span class="brand">Smart Inventory Management</span>
        <span class="brand-tag">OPS</span>
      </div>
      <h1 class="mt-2 mb-3">Sign in</h1>
      <form method="post" id="loginForm">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary w-100 mt-2">Sign in</button>
      </form>

      <div class="demo-accounts-box">
        <div class="demo-accounts-title">
          <i class="bi bi-shield-lock"></i> Quick Fill Roles
        </div>
        <button type="button" class="demo-pill-btn" onclick="fillDemo('admin', 'admin12345')">
          <span><strong class="text-primary">Admin</strong> (Full Control)</span>
          <code>admin / admin12345</code>
        </button>
        <button type="button" class="demo-pill-btn" onclick="fillDemo('staff', 'staff12345')">
          <span><strong class="text-warning">Staff</strong> (POS Control)</span>
          <code>staff / staff12345</code>
        </button>
      </div>

      <p class="auth-switch">New here? <a href="{% url 'register' %}">Create an account</a></p>
    </section>
  </main>
  <script>
    function fillDemo(username, password) {
      const u = document.getElementById('id_username');
      const p = document.getElementById('id_password');
      if (u) u.value = username;
      if (p) p.value = password;
      u && u.focus();
    }
  </script>
  <script src="{% static 'js/app.js' %}?v=20261005_01"></script>
</body>
</html>
